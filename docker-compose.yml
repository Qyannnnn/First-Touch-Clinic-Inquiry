services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nightingale_db
      POSTGRES_USER: nightingale_user
      POSTGRES_PASSWORD: nightingale_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nightingale_postgres:/var/lib/postgresql/data
volumes:
  nightingale_postgres:
